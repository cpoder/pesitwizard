openapi: 3.0.3
info:
  title: PeSIT Server API
  description: PeSIT Wizard server configuration and management API
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local server

security:
  - basicAuth: []

tags:
  - name: Servers
    description: PeSIT server management
  - name: Partners
    description: Partner management
  - name: Virtual Files
    description: Virtual file management
  - name: Cluster
    description: Cluster status
  - name: Transfers
    description: Transfer history

paths:
  /api/v1/servers:
    get:
      tags: [Servers]
      summary: List PeSIT servers
      responses:
        '200':
          description: List of servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PesitServer'
    post:
      tags: [Servers]
      summary: Create a PeSIT server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PesitServerCreate'
      responses:
        '201':
          description: Server created

  /api/v1/servers/{serverId}/start:
    post:
      tags: [Servers]
      summary: Start a server
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Server started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerAction'

  /api/v1/servers/{serverId}/stop:
    post:
      tags: [Servers]
      summary: Stop a server
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Server stopped

  /api/v1/servers/{serverId}/status:
    get:
      tags: [Servers]
      summary: Get server status
      parameters:
        - name: serverId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStatus'

  /api/v1/config/partners:
    get:
      tags: [Partners]
      summary: List partners
      responses:
        '200':
          description: List of partners
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Partner'
    post:
      tags: [Partners]
      summary: Create a partner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerCreate'
      responses:
        '201':
          description: Partner created

  /api/v1/config/partners/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Partners]
      summary: Get partner details
      responses:
        '200':
          description: Partner details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
    put:
      tags: [Partners]
      summary: Update a partner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerUpdate'
      responses:
        '200':
          description: Partner updated
    delete:
      tags: [Partners]
      summary: Delete a partner
      responses:
        '204':
          description: Partner deleted

  /api/v1/config/files:
    get:
      tags: [Virtual Files]
      summary: List virtual files
      responses:
        '200':
          description: List of virtual files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VirtualFile'
    post:
      tags: [Virtual Files]
      summary: Create a virtual file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualFileCreate'
      responses:
        '201':
          description: Virtual file created

  /api/v1/config/files/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Virtual Files]
      summary: Get virtual file details
      responses:
        '200':
          description: Virtual file details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VirtualFile'
    put:
      tags: [Virtual Files]
      summary: Update a virtual file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualFileUpdate'
      responses:
        '200':
          description: Virtual file updated
    delete:
      tags: [Virtual Files]
      summary: Delete a virtual file
      responses:
        '204':
          description: Virtual file deleted

  /api/v1/cluster/status:
    get:
      tags: [Cluster]
      summary: Cluster status
      responses:
        '200':
          description: Cluster status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterStatus'

  /api/v1/transfers:
    get:
      tags: [Transfers]
      summary: Transfer history
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: partnerId
          in: query
          schema:
            type: string
        - name: direction
          in: query
          schema:
            type: string
            enum: [SEND, RECEIVE]
        - name: status
          in: query
          schema:
            type: string
            enum: [COMPLETED, FAILED]
      responses:
        '200':
          description: List of transfers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferPage'

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic

  schemas:
    PesitServer:
      type: object
      properties:
        serverId:
          type: string
        port:
          type: integer
        status:
          type: string
          enum: [RUNNING, STOPPED]
        autoStart:
          type: boolean
        activeConnections:
          type: integer

    PesitServerCreate:
      type: object
      required:
        - serverId
        - port
      properties:
        serverId:
          type: string
        port:
          type: integer
        autoStart:
          type: boolean
          default: true
        maxConnections:
          type: integer
          default: 100
        readTimeout:
          type: integer
          default: 60000

    ServerAction:
      type: object
      properties:
        serverId:
          type: string
        status:
          type: string
        message:
          type: string

    ServerStatus:
      type: object
      properties:
        serverId:
          type: string
        status:
          type: string
        port:
          type: integer
        activeConnections:
          type: integer
        totalTransfers:
          type: integer
        uptime:
          type: integer

    Partner:
      type: object
      properties:
        partnerId:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        allowedOperations:
          type: array
          items:
            type: string
            enum: [READ, WRITE]
        lastConnection:
          type: string
          format: date-time
        transferCount:
          type: integer

    PartnerCreate:
      type: object
      required:
        - partnerId
        - name
      properties:
        partnerId:
          type: string
        name:
          type: string
        password:
          type: string
        enabled:
          type: boolean
          default: true
        allowedOperations:
          type: array
          items:
            type: string
            enum: [READ, WRITE]
          default: [READ, WRITE]

    PartnerUpdate:
      type: object
      properties:
        name:
          type: string
        enabled:
          type: boolean
        allowedOperations:
          type: array
          items:
            type: string

    VirtualFile:
      type: object
      properties:
        fileId:
          type: string
        name:
          type: string
        sendDirectory:
          type: string
        receiveDirectory:
          type: string
        filenamePattern:
          type: string

    VirtualFileCreate:
      type: object
      required:
        - fileId
        - name
      properties:
        fileId:
          type: string
        name:
          type: string
        sendDirectory:
          type: string
        receiveDirectory:
          type: string
        filenamePattern:
          type: string

    VirtualFileUpdate:
      type: object
      properties:
        name:
          type: string
        sendDirectory:
          type: string
        receiveDirectory:
          type: string
        filenamePattern:
          type: string

    ClusterStatus:
      type: object
      properties:
        clusterName:
          type: string
        isLeader:
          type: boolean
        nodeName:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/ClusterMember'
        memberCount:
          type: integer

    ClusterMember:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        isLeader:
          type: boolean

    TransferPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Transfer'
        totalElements:
          type: integer
        totalPages:
          type: integer

    Transfer:
      type: object
      properties:
        id:
          type: integer
        partnerId:
          type: string
        direction:
          type: string
          enum: [SEND, RECEIVE]
        filename:
          type: string
        virtualFileId:
          type: string
        size:
          type: integer
        status:
          type: string
          enum: [COMPLETED, FAILED]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
