name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: false
        default: 'latest'
      skip_tests:
        description: 'Skip smoke tests after deployment'
        required: false
        default: 'false'
        type: boolean

env:
  AWS_REGION: eu-west-1
  EKS_CLUSTER: pesitwizard-staging
  NAMESPACE: staging
  HELM_RELEASE: pesitwizard-staging

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/pesitwizard-server
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=staging-${{ github.run_number }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./pesitwizard-server
          file: ./pesitwizard-server/Dockerfile.optimized
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Determine image tag
        id: image_tag
        run: |
          if [ "${{ github.event.inputs.image_tag }}" != "" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ needs.build.outputs.image_tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy with Helm
        run: |
          helm upgrade --install ${{ env.HELM_RELEASE }} \
            ./pesitwizard-helm-charts/pesitwizard-server \
            -f ./pesitwizard-helm-charts/values-staging.yaml \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set image.tag=${{ steps.image_tag.outputs.tag }} \
            --set postgresql.global.postgresql.auth.postgresPassword=${{ secrets.POSTGRES_ADMIN_PASSWORD }} \
            --set postgresql.global.postgresql.auth.password=${{ secrets.POSTGRES_PASSWORD }} \
            --set redis.auth.password=${{ secrets.REDIS_PASSWORD }} \
            --set config.security.masterKey=${{ secrets.ENCRYPTION_KEY }} \
            --wait \
            --timeout 10m

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ env.HELM_RELEASE }}-pesitwizard-server \
            -n ${{ env.NAMESPACE }} \
            --timeout=5m

      - name: Get deployment status
        run: |
          echo "## Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Pod | Status | Ready |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|-------|" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=pesitwizard-server \
            -o jsonpath='{range .items[*]}| {.metadata.name} | {.status.phase} | {.status.containerStatuses[0].ready} |\n{end}' >> $GITHUB_STEP_SUMMARY

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Run smoke tests
        run: |
          # Get service endpoint
          SERVICE_IP=$(kubectl get svc ${{ env.HELM_RELEASE }}-pesitwizard-server \
            -n ${{ env.NAMESPACE }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')

          if [ -z "$SERVICE_IP" ]; then
            # Port-forward for internal testing
            kubectl port-forward svc/${{ env.HELM_RELEASE }}-pesitwizard-server 8080:8080 \
              -n ${{ env.NAMESPACE }} &
            sleep 5
            SERVICE_IP="localhost"
          fi

          # Health check
          echo "Testing health endpoint..."
          curl -sf "http://${SERVICE_IP}:8080/actuator/health" | jq .

          # Info check
          echo "Testing info endpoint..."
          curl -sf "http://${SERVICE_IP}:8080/actuator/info" | jq .

          # Metrics check
          echo "Testing metrics endpoint..."
          curl -sf "http://${SERVICE_IP}:8080/actuator/prometheus" | head -20

          echo "Smoke tests passed!"

      - name: Test cluster health
        run: |
          # Get a pod name
          POD=$(kubectl get pods -n ${{ env.NAMESPACE }} \
            -l app=pesitwizard-server \
            -o jsonpath='{.items[0].metadata.name}')

          # Check cluster status via pod logs
          kubectl logs $POD -n ${{ env.NAMESPACE }} --tail=50 | grep -i "cluster"

      - name: Report results
        if: always()
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo ":white_check_mark: All smoke tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: Some smoke tests failed" >> $GITHUB_STEP_SUMMARY
          fi

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy, smoke-test]
    if: always()

    steps:
      - name: Send notification
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ] && [ "${{ needs.smoke-test.result }}" == "success" ]; then
            echo "Deployment successful!"
            # Add Slack/Teams notification here
          else
            echo "Deployment or tests failed!"
            # Add failure notification here
          fi
