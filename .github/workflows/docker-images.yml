name: Build and Push Docker Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write  # S4-19: Required for cosign keyless signing

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      client-digest: ${{ steps.build-client.outputs.digest }}
      client-ui-digest: ${{ steps.build-client-ui.outputs.digest }}
      server-digest: ${{ steps.build-server.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Build all Maven modules
      - name: Build all modules
        run: mvn -B install -DskipTests

      - name: Prepare connectors for pesitwizard-client
        run: |
          mkdir -p pesitwizard-client/connectors
          cp pesitwizard-connector-sftp/target/pesitwizard-connector-sftp-*.jar pesitwizard-client/connectors/
          cp pesitwizard-connector-s3/target/pesitwizard-connector-s3-*.jar pesitwizard-client/connectors/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push pesitwizard-client image
      - name: Extract metadata for pesitwizard-client
        id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/pesitwizard-client
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push pesitwizard-client
        id: build-client
        uses: docker/build-push-action@v5
        with:
          context: ./pesitwizard-client
          file: ./pesitwizard-client/Dockerfile
          push: true
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

      # Build and push pesitwizard-client-ui image
      - name: Extract metadata for pesitwizard-client-ui
        id: meta-client-ui
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/pesitwizard-client-ui
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push pesitwizard-client-ui
        id: build-client-ui
        uses: docker/build-push-action@v5
        with:
          context: ./pesitwizard-client-ui
          file: ./pesitwizard-client-ui/Dockerfile
          push: true
          tags: ${{ steps.meta-client-ui.outputs.tags }}
          labels: ${{ steps.meta-client-ui.outputs.labels }}
          cache-from: type=gha,scope=client-ui
          cache-to: type=gha,mode=max,scope=client-ui

      # Build and push pesitwizard-server image
      - name: Extract metadata for pesitwizard-server
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/pesitwizard-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push pesitwizard-server
        id: build-server
        uses: docker/build-push-action@v5
        with:
          context: ./pesitwizard-server
          file: ./pesitwizard-server/Dockerfile.optimized
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  # S4-19: Sign container images with cosign
  sign:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    env:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

    steps:
      - name: Install cosign
        if: env.COSIGN_PRIVATE_KEY != ''
        uses: sigstore/cosign-installer@v3

      - name: Log in to Container Registry
        if: env.COSIGN_PRIVATE_KEY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign pesitwizard-client image
        if: env.COSIGN_PRIVATE_KEY != '' && needs.build.outputs.client-digest != ''
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            ${{ env.REGISTRY }}/${{ github.repository }}/pesitwizard-client@${{ needs.build.outputs.client-digest }}

      - name: Sign pesitwizard-client-ui image
        if: env.COSIGN_PRIVATE_KEY != '' && needs.build.outputs.client-ui-digest != ''
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            ${{ env.REGISTRY }}/${{ github.repository }}/pesitwizard-client-ui@${{ needs.build.outputs.client-ui-digest }}

      - name: Sign pesitwizard-server image
        if: env.COSIGN_PRIVATE_KEY != '' && needs.build.outputs.server-digest != ''
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            ${{ env.REGISTRY }}/${{ github.repository }}/pesitwizard-server@${{ needs.build.outputs.server-digest }}

      - name: Skip signing (no key configured)
        if: env.COSIGN_PRIVATE_KEY == ''
        run: echo "COSIGN_PRIVATE_KEY not configured, skipping image signing"

  # Scan Docker images for vulnerabilities
  scan:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        image:
          - name: pesitwizard-server
            meta-id: meta-server
          - name: pesitwizard-client
            meta-id: meta-client
          - name: pesitwizard-client-ui
            meta-id: meta-client-ui

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image.name }}:latest'
          format: 'sarif'
          output: 'trivy-results-${{ matrix.image.name }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results-${{ matrix.image.name }}.sarif'
          category: 'trivy-${{ matrix.image.name }}'
        continue-on-error: true

      - name: Run Trivy for table output
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: '${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image.name }}:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

  # Make packages public (GHCR packages are private by default)
  publish:
    runs-on: ubuntu-latest
    needs: [build, scan]
    if: always() && needs.build.result == 'success'

    steps:
      - name: Make packages public
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PACKAGES_TOKEN not set, skipping visibility change"
            exit 0
          fi
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]' | cut -d'/' -f2)

          for IMAGE in pesitwizard-client pesitwizard-client-ui pesitwizard-server; do
            # Package name includes repo: pesitwizard/pesitwizard-client -> URL encoded
            PACKAGE_NAME="${REPO}%2F${IMAGE}"
            echo "Setting ${REPO}/${IMAGE} visibility to public..."
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}" \
              -f visibility=public || echo "Could not change visibility for ${IMAGE}"
          done
        continue-on-error: true

  # Trigger enterprise repo to rebuild with latest OSS images
  trigger-enterprise:
    runs-on: ubuntu-latest
    needs: [build, publish]
    if: always() && needs.build.result == 'success'

    steps:
      - name: Trigger enterprise build
        env:
          GH_TOKEN: ${{ secrets.ENTERPRISE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ENTERPRISE_DISPATCH_TOKEN not set, skipping"
            exit 0
          fi
          curl -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pesitwizard/pesitwizard-enterprise/dispatches \
            -d '{"event_type":"oss-build-complete","client_payload":{"ref":"${{ github.ref }}","sha":"${{ github.sha }}"}}'
