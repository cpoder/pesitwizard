name: Soak Test

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Test duration in hours'
        required: false
        default: '72'
        type: string
      concurrent_connections:
        description: 'Number of concurrent connections'
        required: false
        default: '100'
        type: string
  # schedule:
    # Weekly soak test — disabled until EKS staging cluster is provisioned
    # - cron: '0 0 * * 0'

env:
  AWS_REGION: eu-west-1
  EKS_CLUSTER: pesitwizard-staging
  NAMESPACE: soak-test

jobs:
  prepare:
    name: Prepare Environment
    runs-on: ubuntu-latest
    outputs:
      test_id: ${{ steps.test_id.outputs.id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate test ID
        id: test_id
        run: echo "id=soak-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Create soak test namespace
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace ${{ env.NAMESPACE }} purpose=soak-testing --overwrite

      - name: Deploy test environment
        run: |
          helm upgrade --install pesitwizard-soak \
            ./pesitwizard-helm-charts/pesitwizard-server \
            -f ./pesitwizard-helm-charts/values-staging.yaml \
            --namespace ${{ env.NAMESPACE }} \
            --set replicaCount=3 \
            --set resources.requests.memory=4Gi \
            --set resources.limits.memory=8Gi \
            --set config.pesit.maxConnections=300 \
            --wait \
            --timeout 15m

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/pesitwizard-soak-pesitwizard-server \
            -n ${{ env.NAMESPACE }} \
            --timeout=10m

  soak-test:
    name: Run Soak Test
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 4500  # 75 hours max (72h test + buffer)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Start metrics collection
        run: |
          # Deploy metrics collector pod
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: soak-metrics-collector
            namespace: ${{ env.NAMESPACE }}
          spec:
            containers:
            - name: collector
              image: prom/prometheus:latest
              args:
                - --storage.tsdb.retention.time=96h
                - --config.file=/etc/prometheus/prometheus.yml
              volumeMounts:
                - name: config
                  mountPath: /etc/prometheus
                - name: data
                  mountPath: /prometheus
            volumes:
              - name: config
                configMap:
                  name: soak-prometheus-config
              - name: data
                emptyDir:
                  sizeLimit: 10Gi
          ---
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: soak-prometheus-config
            namespace: ${{ env.NAMESPACE }}
          data:
            prometheus.yml: |
              global:
                scrape_interval: 30s
              scrape_configs:
                - job_name: 'pesitwizard'
                  kubernetes_sd_configs:
                    - role: pod
                      namespaces:
                        names:
                          - ${{ env.NAMESPACE }}
                  relabel_configs:
                    - source_labels: [__meta_kubernetes_pod_label_app]
                      action: keep
                      regex: pesitwizard-server
          EOF

      - name: Run soak test
        run: |
          DURATION="${{ github.event.inputs.duration_hours || '72' }}"
          CONNECTIONS="${{ github.event.inputs.concurrent_connections || '100' }}"

          echo "Starting soak test: ${DURATION}h with ${CONNECTIONS} connections"
          echo "Test ID: ${{ needs.prepare.outputs.test_id }}"

          # Get service endpoint
          SERVICE=$(kubectl get svc pesitwizard-soak-pesitwizard-server \
            -n ${{ env.NAMESPACE }} \
            -o jsonpath='{.spec.clusterIP}')

          # Run k6 soak test
          kubectl run soak-runner \
            --image=grafana/k6:latest \
            --restart=Never \
            --namespace=${{ env.NAMESPACE }} \
            --env="BASE_URL=http://${SERVICE}:8080" \
            --env="DURATION=${DURATION}h" \
            --env="CONNECTIONS=${CONNECTIONS}" \
            --command -- /bin/sh -c '
              cat <<EOFK6 > /tmp/soak.js
              import http from "k6/http";
              import { check, sleep } from "k6";

              export const options = {
                stages: [
                  { duration: "30m", target: parseInt(__ENV.CONNECTIONS) },
                  { duration: __ENV.DURATION, target: parseInt(__ENV.CONNECTIONS) },
                  { duration: "15m", target: 0 },
                ],
                thresholds: {
                  http_req_failed: ["rate<0.01"],
                  http_req_duration: ["p(95)<30000"],
                },
              };

              export default function() {
                const res = http.get(__ENV.BASE_URL + "/api/v1/transfers");
                check(res, { "status is 200": (r) => r.status === 200 });
                sleep(1);
              }
              EOFK6
              k6 run --out json=/tmp/results.json /tmp/soak.js
            '

          # Wait for completion
          kubectl wait --for=condition=Ready pod/soak-runner \
            -n ${{ env.NAMESPACE }} \
            --timeout=10m || true

          # Follow logs
          kubectl logs -f soak-runner -n ${{ env.NAMESPACE }} || true

      - name: Collect memory metrics
        if: always()
        run: |
          echo "## Memory Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Get memory usage from pods
          for pod in $(kubectl get pods -n ${{ env.NAMESPACE }} -l app=pesitwizard-server -o name); do
            echo "### $pod" >> $GITHUB_STEP_SUMMARY

            kubectl exec $pod -n ${{ env.NAMESPACE }} -- \
              curl -s localhost:8080/actuator/metrics/jvm.memory.used | \
              jq -r '.measurements[0].value' | \
              xargs -I {} echo "- Current heap: {} bytes" >> $GITHUB_STEP_SUMMARY

            kubectl exec $pod -n ${{ env.NAMESPACE }} -- \
              curl -s localhost:8080/actuator/metrics/jvm.memory.max | \
              jq -r '.measurements[0].value' | \
              xargs -I {} echo "- Max heap: {} bytes" >> $GITHUB_STEP_SUMMARY

            echo "" >> $GITHUB_STEP_SUMMARY
          done

      - name: Collect connection pool metrics
        if: always()
        run: |
          echo "## Connection Pool Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=pesitwizard-server -o jsonpath='{.items[0].metadata.name}')

          kubectl exec $POD -n ${{ env.NAMESPACE }} -- \
            curl -s localhost:8080/actuator/metrics/hikaricp.connections.active | \
            jq -r '.measurements[0].value' | \
            xargs -I {} echo "- Active connections: {}" >> $GITHUB_STEP_SUMMARY

          kubectl exec $POD -n ${{ env.NAMESPACE }} -- \
            curl -s localhost:8080/actuator/metrics/hikaricp.connections.max | \
            jq -r '.measurements[0].value' | \
            xargs -I {} echo "- Max connections: {}" >> $GITHUB_STEP_SUMMARY

          kubectl exec $POD -n ${{ env.NAMESPACE }} -- \
            curl -s localhost:8080/actuator/metrics/hikaricp.connections.timeout | \
            jq -r '.measurements[0].value' | \
            xargs -I {} echo "- Connection timeouts: {}" >> $GITHUB_STEP_SUMMARY

      - name: Generate heap dump (if issues detected)
        if: failure()
        run: |
          POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=pesitwizard-server -o jsonpath='{.items[0].metadata.name}')

          echo "Generating heap dump for $POD"
          kubectl exec $POD -n ${{ env.NAMESPACE }} -- \
            jcmd 1 GC.heap_dump /tmp/heapdump.hprof || true

          kubectl cp ${{ env.NAMESPACE }}/$POD:/tmp/heapdump.hprof ./heapdump.hprof || true

      - name: Upload heap dump
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: heap-dump-${{ needs.prepare.outputs.test_id }}
          path: heapdump.hprof
          retention-days: 7

  analyze:
    name: Analyze Results
    runs-on: ubuntu-latest
    needs: [prepare, soak-test]
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Collect k6 results
        run: |
          kubectl cp ${{ env.NAMESPACE }}/soak-runner:/tmp/results.json ./k6-results.json || true

      - name: Analyze results
        run: |
          if [ -f k6-results.json ]; then
            echo "## Soak Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Extract key metrics
            TOTAL_REQUESTS=$(jq -s 'map(select(.type=="Point" and .metric=="http_reqs")) | length' k6-results.json)
            FAILED_REQUESTS=$(jq -s 'map(select(.type=="Point" and .metric=="http_req_failed" and .data.value==1)) | length' k6-results.json)
            AVG_DURATION=$(jq -s '[.[] | select(.type=="Point" and .metric=="http_req_duration") | .data.value] | add / length' k6-results.json)

            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Total Requests | $TOTAL_REQUESTS |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed Requests | $FAILED_REQUESTS |" >> $GITHUB_STEP_SUMMARY
            echo "| Avg Duration (ms) | $AVG_DURATION |" >> $GITHUB_STEP_SUMMARY

            # Check for memory leaks
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Memory Trend Analysis" >> $GITHUB_STEP_SUMMARY

            # This would ideally query Prometheus for memory over time
            echo "See Prometheus/Grafana for detailed memory trends" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload k6 results
        uses: actions/upload-artifact@v5
        with:
          name: soak-test-results-${{ needs.prepare.outputs.test_id }}
          path: |
            k6-results.json
          retention-days: 30

      - name: Determine test status
        id: status
        run: |
          if [ -f k6-results.json ]; then
            FAILED=$(jq -s 'map(select(.type=="Point" and .metric=="http_req_failed" and .data.value==1)) | length' k6-results.json)
            TOTAL=$(jq -s 'map(select(.type=="Point" and .metric=="http_reqs")) | length' k6-results.json)

            if [ "$TOTAL" -gt 0 ]; then
              ERROR_RATE=$(echo "scale=4; $FAILED / $TOTAL" | bc)
              if (( $(echo "$ERROR_RATE < 0.01" | bc -l) )); then
                echo "status=success" >> $GITHUB_OUTPUT
              else
                echo "status=failure" >> $GITHUB_OUTPUT
              fi
            else
              echo "status=unknown" >> $GITHUB_OUTPUT
            fi
          else
            echo "status=unknown" >> $GITHUB_OUTPUT
          fi

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [prepare, soak-test, analyze]
    if: always()

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Cleanup test resources
        run: |
          echo "Cleaning up soak test resources..."

          # Delete test pods
          kubectl delete pod soak-runner -n ${{ env.NAMESPACE }} --ignore-not-found
          kubectl delete pod soak-metrics-collector -n ${{ env.NAMESPACE }} --ignore-not-found

          # Optionally delete the entire namespace
          # kubectl delete namespace ${{ env.NAMESPACE }} --ignore-not-found

          echo "Cleanup completed"
