{{- if and .Values.cluster .Values.cluster.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pesitwizard-server.fullname" . }}-pod-reader
  labels:
    {{- include "pesitwizard-server.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pesitwizard-server.fullname" . }}-pod-reader
  labels:
    {{- include "pesitwizard-server.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pesitwizard-server.fullname" . }}-pod-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "pesitwizard-server.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
