{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pesitwizard-server.fullname" . }}
  labels:
    {{- include "pesitwizard-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pesitwizard-server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP traffic from ingress controller
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressSelector | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    # Allow PeSIT protocol traffic
    - from: []
      ports:
        - protocol: TCP
          port: 5000
    {{- if and .Values.cluster .Values.cluster.enabled }}
    # Allow JGroups cluster traffic between API pods
    - from:
        - podSelector:
            matchLabels:
              {{- include "pesitwizard-server.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 7800
    {{- end }}
  egress:
    # Allow DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow PostgreSQL
    - to: []
      ports:
        - protocol: TCP
          port: 5432
    {{- if and .Values.cluster .Values.cluster.enabled }}
    # Allow JGroups cluster traffic between API pods
    - to:
        - podSelector:
            matchLabels:
              {{- include "pesitwizard-server.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 7800
    {{- end }}
{{- end }}
