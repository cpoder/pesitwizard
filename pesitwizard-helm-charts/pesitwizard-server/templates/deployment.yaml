apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pesitwizard-server.fullname" . }}
  labels:
    {{- include "pesitwizard-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "pesitwizard-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pesitwizard-server.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "pesitwizard-server.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 180 }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: pesit
              containerPort: 5000
              protocol: TCP
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if and .Values.cluster .Values.cluster.enabled }}
            - name: jgroups
              containerPort: 7800
              protocol: TCP
            {{- end }}
          env:
            {{- if not .Values.extraEnv }}
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            {{- end }}
            {{- if .Values.database }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.database.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              value: {{ .Values.database.password | quote }}
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: "org.postgresql.Driver"
            - name: SPRING_JPA_DATABASE_PLATFORM
              value: "org.hibernate.dialect.PostgreSQLDialect"
            {{- end }}
            {{- if .Values.pesit }}
            - name: PESIT_SERVER_ID
              value: {{ .Values.pesit.server.serverId | default "SERVER-01" | quote }}
            {{- end }}
            {{- if .Values.config }}
            {{- if .Values.config.security }}
            {{- if .Values.config.security.masterKey }}
            - name: PESITWIZARD_SECURITY_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pesitwizard-server.fullname" . }}-secrets
                  key: master-key
            {{- end }}
            {{- if .Values.config.security.encryptionSalt }}
            - name: PESITWIZARD_SECURITY_ENCRYPTION_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ include "pesitwizard-server.fullname" . }}-secrets
                  key: encryption-salt
            {{- end }}
            {{- end }}
            {{- end }}
            {{- range .Values.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- range .Values.extraEnv }}
            - name: {{ .name }}
              {{- if .value }}
              value: {{ .value | quote }}
              {{- end }}
              {{- if .valueFrom }}
              valueFrom:
                {{- toYaml .valueFrom | nindent 16 }}
              {{- end }}
            {{- end }}
          {{- if .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          {{- else }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 5
          {{- end }}
          {{- if .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- else }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 5
            failureThreshold: 10
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
            {{- range .Values.extraVolumeMounts }}
            - {{- toYaml . | nindent 14 }}
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pesitwizard-server.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
        {{- range .Values.extraVolumes }}
        - {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
