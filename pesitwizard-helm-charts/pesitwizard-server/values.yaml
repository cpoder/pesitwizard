# PeSIT Wizard Server Helm Chart Values (Standalone)

replicaCount: 1

image:
  repository: ghcr.io/pesitwizard/pesitwizard/pesitwizard-server
  tag: ""  # REQUIRED: Set to a specific version (e.g., 1.2.2) or use --set image.tag=<version>
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  pesitPort: 6502
  pesitTlsPort: 5001
  httpPort: 8080

resources:
  requests:
    memory: "512Mi"
    cpu: "200m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

# Persistence for transfer data
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

# Server configuration
config:
  # PeSIT settings
  pesit:
    serverId: "PESITSRV"
    # REQUIRED: Set partner password via --set or external secret
    password: ""

  # Security settings for multi-pod deployments
  security:
    # Master key for AES encryption (required for password encryption)
    masterKey: ""
    # Base64-encoded 32-byte salt for AES encryption
    # IMPORTANT: In multi-pod deployments, all pods MUST use the same salt
    # Generate with: openssl rand -base64 32
    # If empty, each pod generates its own salt (single-pod mode only)
    encryptionSalt: ""

  # Logging
  logging:
    level: INFO

# Service Account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Network Policy
networkPolicy:
  enabled: false
  ingressSelector:
    app.kubernetes.io/name: ingress-nginx

# Pod Security Context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Container Security Context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}
