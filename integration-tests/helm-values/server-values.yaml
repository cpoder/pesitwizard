# PeSIT Server - Integration Test Values
replicaCount: 1

image:
  repository: ghcr.io/pesitwizard/pesitwizard/pesitwizard-server
  tag: latest
  pullPolicy: Never

service:
  type: NodePort
  port: 8080
  nodePort: 30080

database:
  host: postgresql
  port: 5432
  name: pesitwizard
  username: pesitwizard
  password: pesitwizard-test-password

config:
  pesit:
    serverId: TEST-SERVER
    password: integration-test-pesit-pw
  security:
    masterKey: "dGVzdC1tYXN0ZXIta2V5LWZvci1pbnRlZ3JhdGlvbg=="
    encryptionSalt: "dGVzdC1lbmNyeXB0aW9uLXNhbHQtZm9yLWludGVncmE="

persistence:
  enabled: true
  size: 1Gi
  storageClass: local-path
  accessMode: ReadWriteOnce

resources:
  requests:
    memory: "512Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

serviceAccount:
  create: true

env:
  - name: LOGGING_LEVEL_ROOT
    value: "INFO"
  - name: SPRING_AUTOCONFIGURE_EXCLUDE
    value: "org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration"
  - name: PESIT_ADMIN_PASSWORD
    value: "integration-test-admin-pw"
  - name: PESIT_OPERATOR_PASSWORD
    value: "integration-test-operator-pw"
  - name: PESIT_USER_PASSWORD
    value: "integration-test-user-pw"
  - name: PESIT_CA_PASSWORD
    value: "integration-test-ca-pw"
  - name: PESIT_CA_TRUSTSTORE_PASSWORD
    value: "integration-test-ts-pw"
  - name: PESIT_BASIC_AUTH_ENABLED
    value: "true"
  - name: PESIT_API_KEY_ADMIN
    value: "integration-test-api-key"
