# PeSIT Client - Integration Test Values
api:
  replicaCount: 1
  image:
    repository: ghcr.io/pesitwizard/pesitwizard/pesitwizard-client
    tag: latest
    pullPolicy: Never
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# Disable UI since we don't build the UI image for integration tests
ui:
  enabled: false

service:
  type: NodePort
  port: 8080
  nodePort: 30081

database:
  host: postgresql
  port: 5432
  name: pesitwizard
  username: pesitwizard
  password: pesitwizard-test-password

persistence:
  store:
    enabled: false
  data:
    enabled: false

tls:
  enabled: false

ingress:
  enabled: false

serviceAccount:
  create: true

env:
  - name: LOGGING_LEVEL_ROOT
    value: "INFO"
  - name: PESITWIZARD_SECURITY_MASTER_KEY
    value: "dGVzdC1tYXN0ZXIta2V5LWZvci1pbnRlZ3JhdGlvbg=="
  - name: PESITWIZARD_SECURITY_ENCRYPTION_SALT
    value: "dGVzdC1lbmNyeXB0aW9uLXNhbHQtZm9yLWludGVncmE="
