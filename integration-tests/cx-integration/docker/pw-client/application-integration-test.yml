# PeSIT Wizard Client - Integration Test Configuration

spring:
  application:
    name: pesitwizard-client

  # In-memory database for testing
  datasource:
    url: jdbc:h2:file:/app/db/pesitwizard-client;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      jakarta:
        persistence:
          jdbc:
            url: jdbc:h2:file:/app/db/pesitwizard-client;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

# Server configuration
server:
  port: 9081
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: always

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    db:
      enabled: false

# PeSIT Wizard client defaults
pesitwizard:
  client:
    id: PWCLIENT
    strict-mode: false
    connection-timeout: 30000
    read-timeout: 120000
    retry-count: 3
    retry-delay: 5000
    receive-directory: /data/received

# Logging
logging:
  level:
    root: WARN
    com.pesitwizard: DEBUG
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
