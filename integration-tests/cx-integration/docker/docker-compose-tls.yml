# Docker Compose for TLS testing between PeSIT Wizard components
# Usage: docker compose -f docker-compose-tls.yml up

services:
  pw-server-tls:
    build:
      context: ./pw-server
      dockerfile: Dockerfile
    container_name: pw-server-tls
    environment:
      - SPRING_PROFILES_ACTIVE=integration-test
      - PESIT_SSL_ENABLED=true
      - PESIT_SSL_KEYSTORE_DATA=${PW_SERVER_KEYSTORE_B64}
      - PESIT_SSL_KEYSTORE_PASSWORD=changeit
      - PESIT_SSL_CA_CERT_PEM=${CA_CERT_PEM}
      - PESIT_SSL_CLIENT_AUTH=NONE
      - PESIT_SSL_PROTOCOL=TLSv1.3
    volumes:
      - pw-send-tls:/data/send
      - pw-received-tls:/data/received
      - ./certs:/app/certs:ro
    ports:
      - "5002:5001"
      - "8082:8080"
    networks:
      - pesit-tls-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  pw-client-tls:
    build:
      context: ./pw-client
      dockerfile: Dockerfile
    container_name: pw-client-tls
    environment:
      - SPRING_PROFILES_ACTIVE=integration-test,nosecurity
    volumes:
      - pw-client-send-tls:/data/send
      - pw-client-received-tls:/data/received
      - ./certs:/app/certs:ro
    ports:
      - "9082:9081"
    networks:
      - pesit-tls-network
    depends_on:
      pw-server-tls:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  tls-test-runner:
    image: eclipse-temurin:21-jre
    container_name: tls-test-runner
    volumes:
      - ./tests:/tests:ro
      - ./certs:/certs:ro
      - pw-client-send-tls:/tmp/pw-client-send
      - pw-received-tls:/tmp/pw-received
    networks:
      - pesit-tls-network
    depends_on:
      pw-server-tls:
        condition: service_healthy
      pw-client-tls:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/tests/run-tls-tests.sh"]

networks:
  pesit-tls-network:
    driver: bridge

volumes:
  pw-send-tls:
  pw-received-tls:
  pw-client-send-tls:
  pw-client-received-tls:
