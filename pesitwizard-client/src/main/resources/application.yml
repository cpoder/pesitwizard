# PeSIT Wizard Client Configuration

spring:
  application:
    name: pesitwizard-client
  lifecycle:
    timeout-per-shutdown-phase: 30s
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:apikey}

  # Database configuration
  datasource:
    url: jdbc:h2:file:./data/pesitwizard-client;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    hibernate:
      # Default: update for H2 development. Production (postgres profile) uses Flyway + none.
      ddl-auto: update
    show-sql: false
    open-in-view: false

  # Flyway database migration - disabled by default (H2 dev mode)
  # Enabled in postgres profile with PostgreSQL-specific migrations
  flyway:
    enabled: false

  # H2 Console (disabled by default for security)
  h2:
    console:
      enabled: false
      path: /h2-console

  # Security - OAuth2/OIDC (configure for production)
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:}

# Server configuration
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    # Do not include stack traces in error responses (security)
    include-stacktrace: never
    # Include error message in responses
    include-message: always
    # Include binding errors in responses
    include-binding-errors: always

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    db:
      enabled: false
  # OTLP metrics - disabled by default, enable with OTEL_EXPORTER_OTLP_ENDPOINT
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_ENABLED:false}
        url: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
    tracing:
      export:
        enabled: ${OTEL_TRACING_ENABLED:false}
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}

# OpenTelemetry - only active when endpoint is configured
otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:}
  service:
    name: ${spring.application.name}

# PeSIT Wizard client defaults
# Security mode:
#   SPRING_PROFILES_ACTIVE=nosecurity   → no auth (dev only)
#   SPRING_PROFILES_ACTIVE=apikey       → static API key auth (set PESITWIZARD_SECURITY_API_KEY)
#   SPRING_PROFILES_ACTIVE=             → OAuth2/JWT (set OAUTH2_JWK_SET_URI)
pesitwizard:
  security:
    api-key: ${PESITWIZARD_SECURITY_API_KEY:}
  # Base directory the UI file browser is allowed to browse.
  # This restricts browsing to a specific path for security.
  # Env var: PESITWIZARD_STORAGE_LOCAL_BROWSE_PATH
  storage:
    local-browse-path: ${PESITWIZARD_STORAGE_LOCAL_BROWSE_PATH:./data}
  # CORS allowed origins (comma-separated).
  # Must be configured for production, e.g. https://myapp.example.com
  # Env var: PESITWIZARD_CORS_ALLOWED_ORIGINS
  cors:
    allowed-origins: ${PESITWIZARD_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  client:
    id: ${PESIT_CLIENT_ID:PESIT_CLIENT}
    strict-mode: false
    connection-timeout: 30000
    read-timeout: 60000
    retry-count: 3
    retry-delay: 5000
    receive-directory: ./received

# OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Logging
logging:
  level:
    root: WARN
    com.pesitwizard: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
  pattern:
    console: "%d{HH:mm:ss} %-5level [%X{traceId:-}] %msg%n"
