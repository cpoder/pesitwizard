# Prometheus Alerting Rules for PeSIT Wizard
# Import this into your Prometheus or Alertmanager configuration
#
# Metrics Reference:
# - pesitwizard.transfer.total{status} - Transfer counters by status
# - pesitwizard.transfer.duration - Transfer duration histogram
# - pesitwizard.connections.active - Active connection count
# - pesitwizard.transfers.active - Active transfer count
# - pesitwizard.error.total{type} - Error counters by type
# - pesitwizard.fpdu.total{type} - FPDU counters by type
# - pesitwizard.syncpoint.total{operation} - Sync point operations
# - pesitwizard.restart.total{status} - Restart operations

groups:
  - name: pesitwizard_transfers
    rules:
      # Alert when transfer failure rate exceeds 10%
      - alert: HighTransferFailureRate
        expr: |
          (
            sum(rate(pesitwizard_transfer_total{status="failed"}[5m]))
            /
            sum(rate(pesitwizard_transfer_total[5m]))
          ) * 100 > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High transfer failure rate"
          description: "Transfer failure rate is {{ $value | printf \"%.1f\" }}% over the last 5 minutes"
          runbook_url: "https://pesitwizard.io/docs/operations#troubleshooting-failed-transfers"

      # Alert when failure rate exceeds 25%
      - alert: CriticalTransferFailureRate
        expr: |
          (
            sum(rate(pesitwizard_transfer_total{status="failed"}[5m]))
            /
            sum(rate(pesitwizard_transfer_total[5m]))
          ) * 100 > 25
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical transfer failure rate"
          description: "Transfer failure rate is {{ $value | printf \"%.1f\" }}% - immediate attention required"
          runbook_url: "https://pesitwizard.io/docs/operations#troubleshooting-failed-transfers"

      # Alert when active transfers exceed capacity
      - alert: HighActiveTransfers
        expr: pesitwizard_transfers_active > 180
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High active transfers"
          description: "{{ $value }} active transfers - approaching capacity limit (200)"
          runbook_url: "https://github.com/pesitwizard/pesitwizard/blob/main/docs/runbooks/high-active-transfers.md"

      # Alert when no transfers for extended period (during business hours)
      - alert: NoTransferActivity
        expr: |
          increase(pesitwizard_transfer_total[1h]) == 0
          and ON() hour() >= 8
          and ON() hour() <= 18
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No transfer activity"
          description: "No transfers detected in the last hour during business hours"

  - name: pesitwizard_connections
    rules:
      # Alert on high connection failures
      - alert: HighConnectionFailures
        expr: rate(pesitwizard_error_total{type="connection"}[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High connection failure rate"
          description: "{{ $value | printf \"%.1f\" }} connection failures per second to {{ $labels.server }}"
          runbook_url: "https://pesitwizard.io/docs/troubleshooting#connection-issues"

      # Alert when connections drop to zero
      - alert: NoActiveConnections
        expr: pesitwizard_connections_active == 0 and pesitwizard_transfers_active > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Connection issue detected"
          description: "Active transfers ({{ $value }}) with no active connections - possible connection leak"
          runbook_url: "https://github.com/pesitwizard/pesitwizard/blob/main/docs/runbooks/connection-issues.md"

      # Alert on high protocol error rate
      - alert: HighProtocolErrorRate
        expr: rate(pesitwizard_error_total{type="protocol"}[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High protocol error rate"
          description: "{{ $value | printf \"%.1f\" }} protocol errors per second"
          runbook_url: "https://github.com/pesitwizard/pesitwizard/blob/main/docs/runbooks/protocol-errors.md"

  - name: pesitwizard_tls
    rules:
      # Alert on TLS certificate expiration (30 days warning)
      - alert: TLSCertificateExpiringSoon
        expr: pesit_tls_certificate_expiry_days < 30
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expiring soon"
          description: "Certificate for {{ $labels.server }} expires in {{ $value }} days"
          runbook_url: "https://pesitwizard.io/docs/security#certificate-renewal"

      # Alert on TLS certificate expiration (7 days critical)
      - alert: TLSCertificateExpiringCritical
        expr: pesit_tls_certificate_expiry_days < 7
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "TLS certificate expiring very soon"
          description: "Certificate for {{ $labels.server }} expires in {{ $value }} days - RENEW IMMEDIATELY"
          runbook_url: "https://pesitwizard.io/docs/security#certificate-renewal"

      # Alert on TLS handshake failures
      - alert: TLSHandshakeFailures
        expr: rate(pesit_tls_handshake_failures_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TLS handshake failures"
          description: "{{ $value | printf \"%.1f\" }} TLS handshake failures per second"
          runbook_url: "https://pesitwizard.io/docs/troubleshooting#tls-issues"

  - name: pesitwizard_performance
    rules:
      # Alert on slow transfers
      - alert: SlowTransfers
        expr: |
          histogram_quantile(0.95, rate(pesitwizard_transfer_duration_seconds_bucket[10m])) > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Slow transfers detected"
          description: "P95 transfer duration is {{ $value | humanizeDuration }} (>5 minutes)"
          runbook_url: "https://pesitwizard.io/docs/performance#slow-transfers"

      # Alert on low throughput
      - alert: LowThroughput
        expr: |
          sum(rate(pesitwizard_bytes_transferred_total[5m])) < 1024
          and sum(pesitwizard_transfers_active) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low transfer throughput"
          description: "Throughput is only {{ $value | humanize1024 }}B/s while transfers are active"

  - name: pesitwizard_resources
    rules:
      # Alert on high JVM memory usage
      - alert: HighJVMMemoryUsage
        expr: |
          (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High JVM heap memory usage"
          description: "JVM heap usage is {{ $value | printf \"%.1f\" }}% on {{ $labels.instance }}"
          runbook_url: "https://pesitwizard.io/docs/performance#jvm-tuning"

      # Alert on high CPU usage
      - alert: HighCPUUsage
        expr: process_cpu_usage * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value | printf \"%.1f\" }}% on {{ $labels.instance }}"

      # Alert on service down
      - alert: PesitWizardDown
        expr: up{job=~".*pesit.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PeSIT Wizard service down"
          description: "Service {{ $labels.instance }} is not responding"
          runbook_url: "https://pesitwizard.io/docs/operations#service-recovery"
