---
# Redis deployment for distributed rate limiting and caching
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: staging
data:
  redis.conf: |
    # Network
    bind 0.0.0.0
    port 6379
    tcp-keepalive 300

    # Memory
    maxmemory 1gb
    maxmemory-policy allkeys-lru

    # Persistence (disable for rate limiting, enable for session storage)
    save ""
    appendonly no

    # Security
    protected-mode yes

    # Performance
    tcp-backlog 511
    timeout 0
    databases 16

    # Cluster mode (for HA)
    # cluster-enabled yes
    # cluster-config-file nodes.conf
    # cluster-node-timeout 5000
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-password
  namespace: staging
type: Opaque
stringData:
  # Generate with: openssl rand -base64 32
  password: "${REDIS_PASSWORD:-changeme-in-production}"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: staging
  labels:
    app: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - /etc/redis/redis.conf
            - --requirepass
            - $(REDIS_PASSWORD)
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      volumes:
        - name: redis-config
          configMap:
            name: redis-config
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: staging
  labels:
    app: redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: redis
  type: ClusterIP
---
# Pod Disruption Budget for Redis
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: staging
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app: redis
